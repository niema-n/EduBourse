services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_education}
      POSTGRES_USER: ${POSTGRES_USER:-financial_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financial_app} -d ${POSTGRES_DB:-financial_education}"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.23
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-Financial Education Assistant}
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-financial_education}
      POSTGRES_USER: ${POSTGRES_USER:-financial_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_local_only}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-financial_education_foundation}
      FRONTEND_URL: http://localhost:${FRONTEND_PUBLIC_PORT:-5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PUBLIC_PORT:-8080}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PUBLIC_PORT:-8080}
    ports:
      - "${FRONTEND_PUBLIC_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app_network

volumes:
  postgres_data:
  chroma_data:

networks:
  app_network:
    driver: bridge
