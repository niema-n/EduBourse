services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_education}
      POSTGRES_USER: ${POSTGRES_USER:-financial_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financial_app} -d ${POSTGRES_DB:-financial_education}"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.23
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-Financial Education Assistant}
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-financial_education}
      POSTGRES_USER: ${POSTGRES_USER:-financial_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_local_only}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-financial_education_foundation}
      FRONTEND_URL: http://localhost:${FRONTEND_PUBLIC_PORT:-5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EDUBOURSE_N8N_INTERNAL_TOKEN: ${EDUBOURSE_N8N_INTERNAL_TOKEN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      # Voice-to-Voice (/api/v1/voice/live): Gemini Live STT + Gemini TTS.
      VOICE_PROVIDER: ${VOICE_PROVIDER:-gemini}
      VOICE_MODE: ${VOICE_MODE:-streaming}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_FINAL_RESPONSE_MAX_OUTPUT_TOKENS: ${AZURE_FINAL_RESPONSE_MAX_OUTPUT_TOKENS:-4096}
      FINAL_RESPONSE_PROVIDER: ${FINAL_RESPONSE_PROVIDER:-azure_openai}
      GEMINI_STT_MODEL: ${GEMINI_STT_MODEL:-}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-2.5-flash-preview-tts}
      GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE:-Kore}
      GEMINI_HTTP_TIMEOUT_MS: ${GEMINI_HTTP_TIMEOUT_MS:-60000}
      # Gemini is used only after the business pipeline, to localize ary output.
      DARIJA_LOCALIZER_PROVIDER: ${DARIJA_LOCALIZER_PROVIDER:-gemini}
      GEMINI_LOCALIZER_MODEL: ${GEMINI_LOCALIZER_MODEL:-gemini-3.6-flash}
      GEMINI_LOCALIZER_MAX_OUTPUT_TOKENS: ${GEMINI_LOCALIZER_MAX_OUTPUT_TOKENS:-4096}
      GEMINI_LIVE_STT_MODEL: ${GEMINI_LIVE_STT_MODEL:-gemini-3.5-transcribe-live}
      VOICE_WS_MAX_CHUNK_BYTES: ${VOICE_WS_MAX_CHUNK_BYTES:-65536}
      VOICE_WS_OUTPUT_CHUNK_BYTES: ${VOICE_WS_OUTPUT_CHUNK_BYTES:-4096}
      VOICE_WS_MAX_SESSION_SECONDS: ${VOICE_WS_MAX_SESSION_SECONDS:-300}
      VOICE_MAX_AUDIO_BYTES: ${VOICE_MAX_AUDIO_BYTES:-10485760}
      # Server-side bridge of the MCP & n8n page (app/api/integrations.py).
      # The token stays in the backend and is never sent to the browser.
      EDUBOURSE_MCP_AUTH_TOKEN: ${EDUBOURSE_MCP_AUTH_TOKEN:-}
      EDUBOURSE_MCP_URL: http://mcp:8000/mcp
      EDUBOURSE_N8N_URL: http://n8n:5678
      # Existing PostgreSQL persistence: conversation history, LangGraph
      # checkpoints and learning profiles (schema from alembic/versions).
      # Set here, not from .env, whose DATABASE_URL targets the host.
      PERSISTENCE_ENABLED: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-financial_app}:${POSTGRES_PASSWORD:-change_me_for_local_only}@postgres:5432/${POSTGRES_DB:-financial_education}
      # Existing financial-expert fallback (app/financial_expert): runs only on
      # the pedagogie route after security and Supervisor, when RAG evidence is
      # insufficient; web grounding only for current or dated market figures.
      FINANCIAL_EXPERT_FALLBACK_ENABLED: "true"
      FINANCIAL_EXPERT_WEB_GROUNDING_ENABLED: "true"
      # gemini-2.5-flash is no longer served for this key (404).
      GEMINI_FINANCIAL_EXPERT_MODEL: ${GEMINI_FINANCIAL_EXPERT_MODEL:-gemini-3.5-flash}
      # Extra approved web-grounding hosts, comma-separated (official AMMC, Bourse
      # de Casablanca and Ecole de la Bourse hosts are always approved).
      FINANCIAL_EXPERT_APPROVED_DOMAINS: ${FINANCIAL_EXPERT_APPROVED_DOMAINS:-}
      # Load BGE-M3 in a background thread at startup so the first question does
      # not pay the ~70 s model load; /health stays available meanwhile.
      RAG_WARMUP_ENABLED: ${RAG_WARMUP_ENABLED:-true}
      # Semantic relevant memory (BGE-M3 per turn) is off for the constrained local
      # runtime; history, recent context and checkpoints remain persisted.
      RELEVANT_MEMORY_ENABLED: ${RELEVANT_MEMORY_ENABLED:-false}
    ports:
      - "127.0.0.1:${BACKEND_PUBLIC_PORT:-8080}:8000"
    volumes:
      - ./backend/data/rag/manifests:/backend/data/rag/manifests:ro
      - ./backend/data/rag/processed:/backend/data/rag/processed:ro
      - ./backend/data/rag/indexes:/backend/data/rag/indexes:rw
      # BGE_M3_CACHE_DIR overrides the host snapshot location when the Hugging Face
      # cache is not under the default user cache.
      - ${BGE_M3_CACHE_DIR:-${USERPROFILE}/.cache/huggingface/hub/models--BAAI--bge-m3}:/home/appuser/.cache/huggingface/hub/models--BAAI--bge-m3:ro
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - app_network
      - n8n_backend_network
      - mcp_backend_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PUBLIC_PORT:-8080}
    ports:
      - "${FRONTEND_PUBLIC_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app_network

volumes:
  postgres_data:
  chroma_data:

networks:
  app_network:
    driver: bridge
  n8n_backend_network:
    name: financial-education-assistant_n8n_backend_network
    external: true
  mcp_backend_network:
    name: financial-education-assistant_mcp_backend_network
    external: true
