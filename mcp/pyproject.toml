[project]
name = "edubourse-mcp"
version = "0.1.0"
description = "Minimal, local-only MCP interface for EduBourse."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
