[project]
name = "financial-education-assistant-backend"
version = "0.1.0"
description = "FastAPI foundation for a financial education assistant."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "chromadb-client==0.5.23",
    "fastapi>=0.115.6",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.7.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.4",
    "ruff>=0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
